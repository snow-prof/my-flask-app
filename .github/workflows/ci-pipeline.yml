name: Flask Production CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Linting (Flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: flake8 app/

  unit-test:
    name: Unit Test (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest

  build-and-push:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest
    needs: [lint, unit-test] # Fail-Fast 관문
    steps:
      - uses: actions/checkout@v4
      - name:  Get SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      - name:  Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name:  Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ env.SHORT_SHA }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name:  Login & Push
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ env.SHORT_SHA }}

  notify:
    name:  Notification
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    steps:
      - uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ needs.build-and-push.result == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: 'Flask CI Status'
          SLACK_MESSAGE: "결과: ${{ needs.build-and-push.result }}\n태그: ${{ github.sha }}"
