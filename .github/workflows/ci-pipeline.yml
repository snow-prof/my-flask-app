name: Flask Production CI Pipeline

on:
  push:
    branches: [ "main", "feat/*" ] # 데모용 브랜치에서도 작동하게 추가
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: 🧹 Lint (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5  # 최신 v5 액션 사용
        with:
          python-version: '3.12'       # CI 안정성을 위해 3.12로 고정
      - run: pip install flake8
      - run: flake8 app/ tests/

  unit-test:
    name: 🧪 Unit Test (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # [해결 핵심] PYTHONPATH를 현재 디렉토리(.)로 명시적 주입
      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest

  build-and-push:
    name: 🐳 Build, Scan & Publish
    runs-on: ubuntu-latest
    needs: [lint, unit-test] 
    steps:
      - uses: actions/checkout@v4
      - name: Get Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ env.SHORT_SHA }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Registry Push (Main Only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/my-flask-app:${{ env.SHORT_SHA }}
